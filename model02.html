<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 1500 股票预测排名 (Top 100 & Bottom 100)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header .meta {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .file-input-container {
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-input-container label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input[type="file"] {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .tab-btn.active-top {
            background: #065f46;
            color: #34d399;
            border-color: #059669;
        }

        .tab-btn.active-bottom {
            background: #881337;
            color: #f87171;
            border-color: #e11d48;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background-color: rgba(51, 65, 85, 0.4);
        }

        .rank-badge {
            display: inline-block;
            min-width: 32px;
            height: 28px;
            line-height: 28px;
            padding: 0 6px;
            text-align: center;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .rank-top {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        .rank-bottom {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .sp-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #334155;
            color: #cbd5e1;
        }

        .sp-500 { background: #1e3a8a; color: #93c5fd; }
        .sp-400 { background: #581c87; color: #e9d5ff; }
        .sp-600 { background: #7c2d12; color: #fdba74; }

        .positive { color: var(--accent-green); font-weight: 600; }
        .negative { color: var(--accent-red); font-weight: 600; }

        .drivers-text {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>S&P 1500 每日预测看板 (Top 100 / Last 100)</h1>
            <div class="meta" id="updateTime">日期：-- | 样本总量：--</div>
        </div>
    </div>

    <!-- 手工选择文件与自动状态提示 -->
    <div class="file-input-container">
        <label for="csvFileInput">📁 手工选择文件：</label>
        <input type="file" id="csvFileInput" accept=".csv" />
        <span id="loadStatus" style="font-size:0.8rem; color:var(--text-muted);">正在尝试自动读取在线数据...</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active-top" onclick="switchTab('top')">🚀 看涨 Top 100</button>
        <button class="tab-btn" id="btnBottom" onclick="switchTab('bottom')">📉 看跌 Last 100</button>
    </div>

    <!-- Top 100 Tab -->
    <div id="topTab" class="tab-content active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>买入排名</th>
                        <th>股票代码</th>
                        <th>标普分类</th>
                        <th>公司名称</th>
                        <th>行业</th>
                        <th>最新收盘价</th>
                        <th>T+5 预测价 (中位数)</th>
                        <th>T+5 预期收益率</th>
                        <th>核心驱动因素 (Top-3)</th>
                    </tr>
                </thead>
                <tbody id="topTableBody">
                    <tr><td colspan="9" class="empty-state">等待数据加载...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bottom 100 Tab -->
    <div id="bottomTab" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>买入排名</th>
                        <th>股票代码</th>
                        <th>标普分类</th>
                        <th>公司名称</th>
                        <th>行业</th>
                        <th>最新收盘价</th>
                        <th>T+5 预测价 (中位数)</th>
                        <th>T+5 预期收益率</th>
                        <th>核心驱动因素 (Top-3)</th>
                    </tr>
                </thead>
                <tbody id="bottomTableBody">
                    <tr><td colspan="9" class="empty-state">等待数据加载...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let globalData = [];

        // 切换 Tab
        function switchTab(type) {
            const topTab = document.getElementById('topTab');
            const bottomTab = document.getElementById('bottomTab');
            const btns = document.querySelectorAll('.tab-btn');

            if (type === 'top') {
                topTab.classList.add('active');
                bottomTab.classList.remove('active');
                btns[0].className = 'tab-btn active-top';
                btns[1].className = 'tab-btn';
            } else {
                bottomTab.classList.add('active');
                topTab.classList.remove('active');
                btns[0].className = 'tab-btn';
                btns[1].className = 'tab-btn active-bottom';
            }
        }

        // CSV 解析逻辑
        function parseCSV(text) {
            const lines = text.split('\n');
            if (lines.length < 2) return [];

            const headers = parseCSVLine(lines[0]);
            const rows = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = parseCSVLine(lines[i]);
                if (values.length === headers.length) {
                    let rowObj = {};
                    headers.forEach((h, idx) => {
                        rowObj[h.trim()] = values[idx].trim();
                    });
                    rows.push(rowObj);
                }
            }
            return rows;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        function getSpBadge(spIndex) {
            if (!spIndex) return '<span class="sp-tag">OTHER</span>';
            let className = 'sp-tag';
            if (spIndex.includes('SP500')) className += ' sp-500';
            else if (spIndex.includes('SP400')) className += ' sp-400';
            else if (spIndex.includes('SP600')) className += ' sp-600';
            return `<span class="${className}">${spIndex}</span>`;
        }

        // 渲染 Top 100 和 Last 100 数据表格
        function renderTables(data) {
            if (!data || data.length === 0) return;

            // 按照 buy_rank 进行正序排列
            data.sort((a, b) => parseFloat(a.buy_rank) - parseFloat(b.buy_rank));

            // 切割前 100 名和倒数 100 名
            const top100 = data.slice(0, 100);
            const last100 = data.slice(-100).reverse(); // 倒数 100 名置顶展示最差的

            const tradeDate = data[0].trade_date || '--';
            document.getElementById('updateTime').innerText = `交易日期：${tradeDate} | 样本总量：${data.length} 只`;

            renderTableBody('topTableBody', top100, true);
            renderTableBody('bottomTableBody', last100, false);
        }

        function renderTableBody(containerId, rows, isTop) {
            const tbody = document.getElementById(containerId);
            tbody.innerHTML = '';

            rows.forEach(row => {
                const tr = document.createElement('tr');
                const returnVal = parseFloat(row.pred_return_q50_t5_pct || 0);
                const returnClass = returnVal >= 0 ? 'positive' : 'negative';
                const rankClass = isTop ? 'rank-top' : 'rank-bottom';
                const returnSign = returnVal >= 0 ? '+' : '';

                tr.innerHTML = `
                    <td><span class="rank-badge ${rankClass}">${row.buy_rank}</span></td>
                    <td><strong>${row.ticker}</strong></td>
                    <td>${getSpBadge(row.sp_index)}</td>
                    <td>${row.company_name || '--'}</td>
                    <td style="color:var(--text-muted);">${row.industry || '--'}</td>
                    <td>$${parseFloat(row.close || 0).toFixed(2)}</td>
                    <td>$${parseFloat(row.pred_price_q50_t5 || 0).toFixed(2)}</td>
                    <td class="${returnClass}">${returnSign}${returnVal.toFixed(2)}%</td>
                    <td class="drivers-text" title="${row.top_drivers || ''}">${row.top_drivers || '--'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 1. 手工选择 CSV 文件监听
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('loadStatus');
            statusEl.innerText = `正在读取本地文件: ${file.name}...`;

            const reader = new FileReader();
            reader.onload = function(evt) {
                globalData = parseCSV(evt.target.result);
                if (globalData.length > 0) {
                    renderTables(globalData);
                    statusEl.innerText = `✅ 已成功载入本地文件: ${file.name}`;
                    statusEl.style.color = '#10b981';
                } else {
                    statusEl.innerText = `❌ 文件解析失败或格式为空`;
                    statusEl.style.color = '#ef4444';
                }
            };
            reader.readAsText(file);
        });

        // 2. 部署到 GitHub Pages 时的自动加载逻辑（优先尝试同级目录下的 latest_recommendations.csv）
        window.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('loadStatus');
            
            fetch('latest_recommendations.csv')
                .then(res => {
                    if (!res.ok) throw new Error('网络文件未找到');
                    return res.text();
                })
                .then(text => {
                    globalData = parseCSV(text);
                    if (globalData.length > 0) {
                        renderTables(globalData);
                        statusEl.innerText = `✅ 已自动同步最新在线数据 (latest_recommendations.csv)`;
                        statusEl.style.color = '#10b981';
                    }
                })
                .catch(() => {
                    statusEl.innerText = `💡 提示：未能自动获取在线数据，请通过左侧按钮手工选择 CSV 文件`;
                    statusEl.style.color = '#94a3b8';
                    document.getElementById('topTableBody').innerHTML = 
                        '<tr><td colspan="9" class="empty-state">请在上方点击“手工选择文件”上传推荐数据 CSV 并在本地展示</td></tr>';
                });
        });
    </script>
</body>
</html>
